jobs:
  sync:
    runs-on: ubuntu-latest
    # 添加权限配置
    permissions:
      contents: write  # 授予仓库内容写入权限

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整提交历史

    - name: Install Rclone
      run: sudo curl https://rclone.org/install.sh | sudo bash

    - name: Configure Rclone
      env:
        RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        sed -i "s/your_client_id_here/$CLIENT_ID/g" ~/.config/rclone/rclone.conf
        sed -i "s/your_client_secret_here/$CLIENT_SECRET/g" ~/.config/rclone/rclone.conf

    - name: Prepare Directory
      run: mkdir -p ./LightNovel

    - name: Sync from OneDrive
      run: rclone sync onedrive:/LightNovel ./LightNovel -v

    - name: Commit changes
      run: |
        # 配置 Git 身份
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 添加所有变更
        git add .
        
        # 智能提交（仅在存在变更时提交）
        if git diff-index --quiet HEAD; then
          echo "No changes to commit"
        else
          git commit -m "[Auto] Sync files from OneDrive $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 强制推送更新（避免历史冲突）
          git push origin HEAD:${GITHUB_REF#refs/heads/} --force
        fi
