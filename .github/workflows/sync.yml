name: Sync to Dropbox

on:
  push:
    branches: [ main ]  # 触发分支

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup rclone
        run: |
          # 下载并安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone

      - name: Configure rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          # 解码配置并写入文件
          mkdir -p ~/.config/rclone
          echo $RCLONE_CONFIG_BASE64 | base64 -d > ~/.config/rclone/rclone.conf

      - name: Sync to Dropbox
        run: |
          # 同步仓库文件到 Dropbox（示例路径：dropbox:/my_folder）
          rclone copy --progress ./ dropbox:/LightNovel/
