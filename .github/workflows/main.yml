  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rclone
      run: sudo curl https://rclone.org/install.sh | sudo bash

    - name: Configure Rclone
      env:
        RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        sed -i "s/your_client_id_here/$CLIENT_ID/g" ~/.config/rclone/rclone.conf
        sed -i "s/your_client_secret_here/$CLIENT_SECRET/g" ~/.config/rclone/rclone.conf
        cat ~/.config/rclone/rclone.conf  # 调试输出

    - name: Verify Configuration
      run: rclone config show onedrive  # 确认配置段能被识别

    - name: Sync from OneDrive
      run: rclone sync onedrive:/YourFolderPath ./local_folder -v
