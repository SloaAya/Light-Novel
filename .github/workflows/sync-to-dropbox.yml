name: Sync dropbox

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "[dropbox]" > ~/.config/rclone/rclone.conf
          echo "type = dropbox" >> ~/.config/rclone/rclone.conf
          echo "token = {\"access_token\":\"${{ secrets.DROPBOX_ACCESS_TOKEN }}\",\"token_type\":\"bearer\",\"expiry\":\"0001-01-01T00:00:00Z\"}" >> ~/.config/rclone/rclone.conf

      - name: 仅上传新文件
        run: |
          rclone copy ./ dropbox:/微凉半度/ \
            --progress \
            --ignore-existing \       # 核心参数：跳过已存在的文件
            --include "轻小说/**" \    # 仅处理轻小说文件夹
            --exclude "*"             # 排除其他所有内容
