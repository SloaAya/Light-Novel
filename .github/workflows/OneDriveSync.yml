name: OneDrive Sync

on: workflow_dispatch  # 仅手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必需写入权限

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Rclone
      run: sudo curl https://rclone.org/install.sh | sudo bash

    - name: Configure Rclone
      env:
        RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

    - name: Sync Files
      run: |
        mkdir -p ./LightNovel
        rclone sync onedrive:/LightNovel ./LightNovel -v

    - name: Commit Changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "Auto Sync"
        git config --global user.email "auto@sync"
        git add .
        git diff-index --quiet HEAD || git commit -m "Sync from OneDrive"
        git push
