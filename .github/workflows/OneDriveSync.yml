name: OneDrive Sync

on: workflow_dispatch  # 仅手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须写入权限

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整提交历史

    - name: Install Rclone
      run: sudo curl https://rclone.org/install.sh | sudo bash

    - name: Configure Rclone (关键修复)
      env:
        RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf  # 直接写入完整配置
        echo "✅ Rclone 配置文件已生成"  # 调试提示

    - name: Validate Connection
      run: rclone lsd onedrive:  # 连接验证

    - name: Sync Files
      run: |
        mkdir -p ./LightNovel
        rclone sync onedrive:/LightNovel ./LightNovel -v

    - name: Commit changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "Auto Sync Bot"
        git config --global user.email "auto-sync@users.noreply.github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "🚀 Auto Sync from OneDrive"
        git push
