name: OneDrive Sync

on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rclone
      run: sudo curl -sS https://rclone.org/install.sh | sudo bash

    - name: Configure Rclone
      env:
        RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      run: |
        mkdir -p $HOME/.config/rclone
        echo "$RCLONE_CONFIG" > $HOME/.config/rclone/rclone.conf
        echo "Config validation:"
        rclone config show onedrive

    - name: Create sync directory
      run: mkdir -p ./LightNovel

    - name: Perform sync
      run: rclone sync onedrive:/LightNovel ./LightNovel -v

    - name: Commit changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "Sync Bot"
        git config --global user.email "sync@bot"
        git add .
        git diff-index --quiet HEAD || git commit -m "Sync from OneDrive"
        git push origin HEAD:${{ github.ref_name }}
